name: Install verified Review 11
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and install fixed review package
        run: |
          echo 'c79372b5f2aa2c87e0512809cecc5f0d7491665e9b9db8127d439d208e0c767e  review-11-build.zip' | sha256sum --check --strict
          unzip -oq review-11-build.zip
          test -f review-11/index.html
          test -f review-11/work/mclaren-unconventional-symphony/index.html
          git add -- review-11
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Install audited traditional website Review 11'
            git push origin HEAD:main
          fi
      - name: Request existing Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
