name: Install verified Review 11
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and install fixed review package
        run: |
          echo '2328a8a267076cb8da53972c450201f5c6fac9bb8759a9f9308ba66efc29a427  review-11-build.zip' | sha256sum --check --strict
          git rm --ignore-unmatch -- review-11/review/__next._full.txt review-11/review/__next._tree.txt review-11/review/__next.review.__PAGE__.txt review-11/review/index.html review-11/review/index.txt
          unzip -oq review-11-build.zip
          test -f review-11/index.html
          test -f review-11/work/mclaren-unconventional-symphony/index.html
          test ! -f review-11/review/index.html
          git add -- review-11
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove internal review copy from traditional website preview'
            git push origin HEAD:main
          fi
      - name: Request existing Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
